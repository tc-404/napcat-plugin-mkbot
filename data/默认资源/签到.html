<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到卡片</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ================== 重置 & 透明核心 ================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }

        /* ================== 容器 (圆角 + overflow hidden) ================== */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 20px 30px;
            overflow: hidden;
            border-radius: 36px;
            background: transparent !important;
            transition: all 0.5s ease;
            /* 确保伪元素背景在下面 */
            z-index: 1;
        }

        /* ===== 背景层：用伪元素实现渐变，规避 clip-path 白色边缘 ===== */
        .container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 36px;
            z-index: -1;
            transition: background 0.5s ease;
        }

        /* 白天主题 - 未签到 (橙蓝) */
        .theme-day::before {
            background: linear-gradient(135deg, #ffe0b2, #b3e5fc);
        }
        .theme-day {
            box-shadow: 0 25px 80px rgba(255, 152, 0, 0.25);
        }

        /* 夜晚主题 - 已签到 (蓝橙) */
        .theme-night::before {
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
        }
        .theme-night {
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        /* ================== 头部 ================== */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            padding-top: 0;
            margin-top: -8px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: white;
            padding: 3px;
            border: 3px solid transparent;
            background-clip: padding-box;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .theme-day .avatar::before {
            content: '';
            position: absolute;
            inset: -3px;
            z-index: -1;
            border-radius: 22px;
            background: linear-gradient(135deg, #ff5722, #ff9800, #48cae4);
        }
        .theme-night .avatar::before {
            content: '';
            position: absolute;
            inset: -3px;
            z-index: -1;
            border-radius: 22px;
            background: linear-gradient(135deg, #f59e0b, #3b82f6, #06b6d4);
        }
        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            object-fit: cover;
        }

        .user-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.2;
            margin-top: -4px;
        }

        .user-name {
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
        }
        .theme-day .user-name {
            color: #ff5722;
        }
        .theme-night .user-name {
            color: #60a5fa;
        }

        .user-qq {
            font-size: 15px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
            margin-top: 2px;
        }
        .theme-day .user-qq {
            color: #ff9800;
        }
        .theme-night .user-qq {
            color: #93c5fd;
        }

        /* ================== 排名 ================== */
        .rank-container {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-top: -4px;
        }

        .rank-number {
            font-size: 50px;
            font-weight: 800;
            line-height: 1.2;
            padding-top: 6px;
            padding-bottom: 4px;
        }
        .theme-day .rank-number {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .theme-night .rank-number {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ================== 主内容区 ================== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            width: 100%;
        }

        /* --- 已签到大字 (蓝橙) --- */
        .signed-big-text {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 8px;
            text-shadow: 0 0 60px rgba(59, 130, 246, 0.6);
            animation: pulseSigned 2s ease-in-out infinite alternate;
        }
        .theme-day .signed-big-text {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 40px rgba(255, 87, 34, 0.5));
        }
        .theme-night .signed-big-text {
            background: linear-gradient(135deg, #f59e0b, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.5));
        }
        @keyframes pulseSigned {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.5));
            }
            100% {
                transform: scale(1.04);
                filter: drop-shadow(0 0 70px rgba(59, 130, 246, 0.9));
            }
        }

        /* --- 积分显示 --- */
        .points-display {
            text-align: center;
        }
        .points-row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 50px;
            flex-wrap: wrap;
        }
        .point-item {
            display: inline-flex;
            align-items: baseline;
            position: relative;
        }
        .point-prefix {
            font-size: 38px;
            font-weight: 700;
            margin-right: 10px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.8);
        }
        .theme-day .point-prefix {
            color: #ff5722;
        }
        .theme-night .point-prefix {
            color: #93c5fd;
        }

        .point-value {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
        }
        /* 白天 - 归笺 (橙) */
        .theme-day .point-item:nth-child(1) .point-value {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(255, 87, 34, 0.8));
            animation: glowOrange 2s ease-in-out infinite alternate;
        }
        /* 夜晚 - 归笺 (橙) */
        .theme-night .point-item:nth-child(1) .point-value {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(245, 158, 11, 0.8));
            animation: glowOrange 2s ease-in-out infinite alternate;
        }
        /* 白天 - 诱饵 (蓝) */
        .theme-day .point-item:nth-child(2) .point-value {
            background: linear-gradient(135deg, #00e5ff, #80deea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(0, 229, 255, 0.8));
            animation: glowBlue 2s ease-in-out infinite alternate;
        }
        /* 夜晚 - 诱饵 (亮蓝) */
        .theme-night .point-item:nth-child(2) .point-value {
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.8));
            animation: glowBlue 2s ease-in-out infinite alternate;
        }

        @keyframes glowOrange {
            0% {
                filter: drop-shadow(0 0 30px rgba(255, 87, 34, 0.8));
            }
            100% {
                filter: drop-shadow(0 0 50px rgba(255, 87, 34, 1));
            }
        }
        @keyframes glowBlue {
            0% {
                filter: drop-shadow(0 0 30px rgba(0, 229, 255, 0.8));
            }
            100% {
                filter: drop-shadow(0 0 50px rgba(0, 229, 255, 1));
            }
        }

        /* ================== 底部统计卡片 (玻璃透明度40%) ================== */
        .stats-card {
            width: 100%;
            backdrop-filter: blur(25px);
            border-radius: 28px;
            padding: 24px 24px 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 20;
        }
        .theme-day .stats-card {
            background: rgba(255, 255, 255, 0.4);
        }
        .theme-night .stats-card {
            background: rgba(30, 41, 59, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
            text-align: center;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-label {
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .theme-day .stat-label {
            color: #ff9800;
        }
        .theme-night .stat-label {
            color: #93c5fd;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 900;
            line-height: 1.2;
        }
        .theme-day .stat-value {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 87, 34, 0.7));
        }
        .theme-night .stat-value {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.7));
        }

        /* ================== 分割线 ================== */
        .divider {
            width: 100%;
            height: 1px;
            margin: 18px 0;
            position: relative;
            border-radius: 1px;
        }
        .theme-day .divider {
            background: rgba(255, 152, 0, 0.15);
        }
        .theme-night .divider {
            background: rgba(59, 130, 246, 0.15);
        }
        .divider::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 10%;
            width: 80%;
            height: 1px;
            border-radius: 1px;
        }
        .theme-day .divider::after {
            background: repeating-linear-gradient(to right, transparent, transparent 6px, rgba(255, 152, 0, 0.4) 6px, rgba(255, 152, 0, 0.4) 12px);
        }
        .theme-night .divider::after {
            background: repeating-linear-gradient(to right, transparent, transparent 6px, rgba(59, 130, 246, 0.4) 6px, rgba(59, 130, 246, 0.4) 12px);
        }

        /* ================== 事件标签 ================== */
        .events-area {
            width: 100%;
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            min-height: 0;
        }
        .events-area:empty {
            display: none;
        }

        .event-tag {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        .theme-day .event-tag {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
            border: 1px solid rgba(255, 152, 0, 0.3);
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.2);
        }
        .theme-night .event-tag {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.2);
        }
        .event-tag.bonus {
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }
        .theme-night .event-tag.bonus {
            background: linear-gradient(135deg, #f59e0b, #3b82f6);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ================== 浮动背景装饰 ================== */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            z-index: 1;
            pointer-events: none;
        }
        .theme-day .blob-1 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #ffcc80, #ff9800);
            top: -120px;
            right: -100px;
            animation: float 8s ease-in-out infinite;
        }
        .theme-day .blob-2 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #90e0ef, #00b4d8);
            bottom: 40px;
            left: -100px;
            animation: float 10s ease-in-out infinite reverse;
        }
        .theme-day .blob-3 {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #b3e5fc, #4fc3f7);
            top: 50%;
            left: 15%;
            animation: float 12s ease-in-out infinite;
        }
        .theme-night .blob-1 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #3b82f6, #1e3a8a);
            top: -120px;
            right: -100px;
            animation: float 8s ease-in-out infinite;
        }
        .theme-night .blob-2 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, #f59e0b, #ea580c);
            bottom: 40px;
            left: -100px;
            animation: float 10s ease-in-out infinite reverse;
        }
        .theme-night .blob-3 {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #06b6d4, #0e7490);
            top: 50%;
            left: 15%;
            animation: float 12s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-25px) scale(1.05);
            }
        }

        /* ================== 响应式 ================== */
        @media (max-width: 380px) {
            .container {
                padding: 30px 16px 20px;
            }
            .point-value {
                font-size: 88px;
            }
            .point-prefix {
                font-size: 28px;
            }
            .user-name {
                font-size: 22px;
            }
            .avatar {
                width: 64px;
                height: 64px;
            }
            .stats-card {
                padding: 18px;
            }
            .stat-value {
                font-size: 28px;
            }
            .stat-label {
                font-size: 14px;
            }
            .signed-big-text {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container {{themeClass}}">
        <!-- 背景装饰浮动球 -->
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
        <div class="bg-blob blob-3"></div>

        <!-- ===== 头部 ===== -->
        <div class="header">
            <div class="user-info">
                <div class="avatar">
                    <img src="{{avatarUrl}}" alt="头像">
                </div>
                <div class="user-text">
                    <div class="user-name">{{userName}}</div>
                    <div class="user-qq">QQ: {{userId}}</div>
                </div>
            </div>
            <div class="rank-container">
                <div class="rank-number">{{rankText}}</div>
            </div>
        </div>

        <!-- ===== 主内容 ===== -->
        <div class="main-content">
            {{contentHtml}}
        </div>

        <!-- ===== 底部统计 ===== -->
        <div class="stats-card">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">累计天数</div>
                    <div class="stat-value">{{totalDays}}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">连签次数</div>
                    <div class="stat-value">{{streakText}}</div>
                </div>
            </div>
            <div class="divider"></div>
            <div class="events-area">
                {{eventsHtml}}
            </div>
        </div>
    </div>
</body>
</html>
